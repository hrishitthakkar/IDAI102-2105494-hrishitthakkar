  <g fill="#222">
    <text x="25" y="40" font-weight="bold">SIDEBAR</text>
    <text x="25" y="70">• CO₂ goal slider</text><text x="25" y="95">• High-contrast toggle</text>
    <text x="25" y="120">• Eco tips on/off</text><text x="25" y="160">• Load sample data</text>
    <text x="25" y="185">• Download / upload CSV</text><text x="25" y="210">• Undo / clear</text>
    <text x="25" y="250">• Quote of the day</text>
    <text x="245" y="57" font-size="22" font-weight="bold">ShopImpact  +  one-line purpose</text>
    <text x="245" y="122" font-weight="bold">1. Log a planned purchase (inputs at the top)</text>
    <text x="255" y="160">Product type ▾</text><text x="465" y="160">Brand</text>
    <text x="635" y="160">Price ₹</text><text x="785" y="160">Date</text>
    <text x="260" y="222" font-weight="bold">CO₂ "price tag" — live estimate</text>
    <text x="260" y="244">kg CO₂e · Low/Med/High · ≈ km driven</text>
    <text x="650" y="222" font-weight="bold">Greener alternatives</text>
